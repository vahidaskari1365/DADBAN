name: Bing Submit Probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Probe SubmitFeed formats
        env:
          BING_API_KEY: ${{ secrets.BING_API_KEY }}
        run: node scripts/bing-probe-submit.mjs
