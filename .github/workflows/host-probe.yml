name: Host probe & force-install (cPanel)

# ابزار عملیاتی: وضعیت هاست را از طریق FTP می‌خواند (لاگ deploy-agent و اینباکس)
# و در صورت نیاز، تاربال تازه را دوباره آپلود و مارکر نصب را حذف می‌کند تا تیک
# بعدی کرون، ریلیز را قطعاً نصب کند. تنها با workflow_dispatch اجرا می‌شود.

on:
  workflow_dispatch:
    inputs:
      force_install:
        description: "re-upload tarball + remove install marker (force next cron tick)"
        required: false
        default: "false"
      patch_agent:
        description: "upload patched deploy-agent.sh with hard restart (kill stale node)"
        required: false
        default: "false"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inspect host state
        env:
          FTP_HOST: ${{ secrets.CPANEL_FTP_HOST }}
          FTP_PORT: ${{ secrets.CPANEL_FTP_PORT || 21 }}
          FTP_USER: ${{ secrets.CPANEL_FTP_USER }}
          FTP_PASS: ${{ secrets.CPANEL_FTP_PASS }}
          APP_DIR: ${{ secrets.CPANEL_APP_DIR }}
        run: |
          set +e
          sudo apt-get update -y -qq >/dev/null 2>&1 || true
          sudo apt-get install -y -qq lftp >/dev/null 2>&1 || sudo apt-get install -y lftp
          LFTP="lftp -u $FTP_USER,$FTP_PASS -p $FTP_PORT ftp://$FTP_HOST"
          echo "=== app dir top-level (freshness of server.js/app.js/.next) ==="
          $LFTP <<EOF 2>&1
            set ftp:ssl-allow off
            set ftp:passive-mode on
            ls -la "$APP_DIR"
            bye
          EOF
          echo "=== BUILD_ID on host ==="
          mkdir -p fetched
          $LFTP <<EOF2 2>&1
            set ftp:ssl-allow off
            set ftp:passive-mode on
            get -O fetched "$APP_DIR/.next/BUILD_ID"
            get -O fetched "$APP_DIR/.next/server/app/llms.txt.body"
            get -O fetched deploy-agent.log
            get -O fetched deploy-agent.sh
            get -O fetched "$APP_DIR/stderr.log"
            get -O fetched "$APP_DIR/tmp/boot-status.log"
            bye
          EOF2
          echo "--- boot-status.log (app boot trace) ---"
          tail -40 fetched/boot-status.log 2>/dev/null || echo "(no boot-status.log yet)"
          echo "--- BUILD_ID ---"; cat fetched/BUILD_ID 2>/dev/null || echo "(missing)"
          echo "--- prerendered llms.txt.body head (CANARY — must contain نسخه محتوای مجله in new build) ---"
          head -8 fetched/llms.txt.body 2>/dev/null || head -8 fetched/llms-body.txt 2>/dev/null || echo "(llms.txt.body not found — handler may be dynamic)"
          echo "--- stderr.log: boot markers ---"
          grep -a "auto-seed" fetched/stderr.log 2>/dev/null | tail -6 || echo "(no auto-seed lines)"
          echo "--- stderr.log: EADDRINUSE / listening ---"
          grep -aE "EADDRINUSE|listening on|Ready in" fetched/stderr.log 2>/dev/null | tail -6 || echo "(none)"
          echo "--- stderr.log: very end (last 2500 bytes) ---"
          tail -c 2500 fetched/stderr.log 2>/dev/null || echo "(no stderr.log)"
          echo "--- agent log: HARD-RESTART evidence ---"
          grep -n "HARD-RESTART" fetched/deploy-agent.log 2>/dev/null | tail -3 || echo "(no HARD-RESTART line yet)"
          echo "--- host deploy-agent.sh: restart-related lines ---"
          grep -nE "restart|pkill|kill" fetched/deploy-agent.sh 2>/dev/null || echo "(no match)"

      - name: Patch host deploy-agent.sh (hard restart on fresh restart.txt)
        if: ${{ github.event.inputs.patch_agent == 'true' }}
        env:
          FTP_HOST: ${{ secrets.CPANEL_FTP_HOST }}
          FTP_PORT: ${{ secrets.CPANEL_FTP_PORT || 21 }}
          FTP_USER: ${{ secrets.CPANEL_FTP_USER }}
          FTP_PASS: ${{ secrets.CPANEL_FTP_PASS }}
          APP_DIR: ${{ secrets.CPANEL_APP_DIR }}
        run: |
          set -e
          # ۱) نسخهٔ میزبان را می‌گیریم (باید دقیقاً v2.4 ریپو باشد — ۱۲۷۸۳ بایت)
          lftp -u "$FTP_USER","$FTP_PASS" -p "$FTP_PORT" "ftp://$FTP_HOST" <<'EOF' 2>&1
            set ftp:ssl-allow off
            set ftp:passive-mode on
            get -O /tmp deploy-agent.sh
            bye
          EOF
          python3 scripts/patch-deploy-agent.py /tmp/deploy-agent.sh
          grep -q "HARD-RESTART-BLOCK" /tmp/deploy-agent.sh
          # ۲) آپلود نسخهٔ پچ‌شده
          lftp -u "$FTP_USER","$FTP_PASS" -p "$FTP_PORT" "ftp://$FTP_HOST" <<EOF2 2>&1
            set ftp:ssl-allow off
            set ftp:passive-mode on
            put -O . /tmp/deploy-agent.sh
            bye
          EOF2
          echo "✓ patched deploy-agent.sh uploaded — next cron tick hard-restarts stale node"

      - name: Download fresh tarball from release
        if: ${{ github.event.inputs.force_install == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download latest-cpanel --repo "$GITHUB_REPOSITORY" \
            --pattern "release.tar.gz" --output release.tar.gz
          ls -la release.tar.gz

      - name: Force reinstall on next cron tick (fresh upload + remove marker)
        if: ${{ github.event.inputs.force_install == 'true' }}
        env:
          FTP_HOST: ${{ secrets.CPANEL_FTP_HOST }}
          FTP_PORT: ${{ secrets.CPANEL_FTP_PORT || 21 }}
          FTP_USER: ${{ secrets.CPANEL_FTP_USER }}
          FTP_PASS: ${{ secrets.CPANEL_FTP_PASS }}
          APP_DIR: ${{ secrets.CPANEL_APP_DIR }}
        run: |
          lftp -u "$FTP_USER","$FTP_PASS" -p "$FTP_PORT" "ftp://$FTP_HOST" <<EOF
            set net:max-retries 5
            set net:timeout 40
            set ftp:ssl-allow off
            set ftp:passive-mode on
            put -O "$APP_DIR/.release-inbox" release.tar.gz
            rm -f "$APP_DIR/.deploy-version"
            ls -l "$APP_DIR/.release-inbox"
            bye
          EOF
          echo "✓ tarball re-uploaded + marker removed — next cron tick must install"
