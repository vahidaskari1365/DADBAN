name: Admin access recovery (one-off)

# ─────────────────────────────────────────────────────────────────────────────
# یک‌بارمصرف — بازیابی اعتبارنامهٔ مالک پنل ادمین از .env هاست.
#
# پس‌زمینه: ورود مالک از ADMIN_EMAIL/ADMIN_PASSWORD هاست می‌آید که در Secret
# CPANEL_ENV_B64 هم write-only است و قابل خواندن نیست. SSH هم بسته است.
# این ورک‌فلو از همان کانال FTP استقرار استفاده می‌کند ولی به‌جای دانلودِ
# کل .env، فقط دو خط ADMIN_* را استخراج و در آرتیفکت یک‌روزه می‌گذارد.
#
# امنیت:
#  - اول FTPS (TLS) امتحان می‌شود؛ اگر هاست پشتیبانی نکرد فالبک به FTP ساده.
#  - کل .env هرگز آرتیفکت/لاگ نمی‌شود؛ فقط ADMIN_EMAIL و ADMIN_PASSWORD.
#  - پس از استفاده: آرتیفکت + ران + همین فایل حذف می‌شوند.
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Extract ADMIN_* lines from host .env (FTPS preferred)
        env:
          FTP_HOST: ${{ secrets.CPANEL_FTP_HOST }}
          FTP_PORT: ${{ secrets.CPANEL_FTP_PORT || 21 }}
          FTP_USER: ${{ secrets.CPANEL_FTP_USER }}
          FTP_PASS: ${{ secrets.CPANEL_FTP_PASS }}
          APP_DIR: ${{ secrets.CPANEL_APP_DIR }}
        run: |
          set -e
          sudo apt-get update -y -qq >/dev/null 2>&1 || true
          sudo apt-get install -y -qq lftp >/dev/null 2>&1 || sudo apt-get install -y lftp
          mkdir -p /tmp/work /tmp/out
          chmod 700 /tmp/work

          fetch_env () {  # $1 = ssl-mode string (lftp settings)
            lftp -u "$FTP_USER","$FTP_PASS" -p "$FTP_PORT" "ftp://$FTP_HOST" $1 <<EOF
            set net:max-retries 2
            set net:timeout 30
            $1
            get -O /tmp/work "$APP_DIR/.env"
            bye
          EOF
          }

          echo "→ تلاش با FTPS (TLS)…"
          if fetch_env "set ftp:ssl-allow on; set ftp:ssl-force true; set ftp:ssl-protect-data true;" 2>/tmp/work/ftps.err && [ -f /tmp/work/.env ]; then
            echo "✓ دانلود با FTPS موفق — کانال رمزنگاری‌شده"
          else
            echo "⚠ FTPS نشد — فالبک به FTP ساده (مثل مسیر استقرار فعلی)"
            fetch_env "set ftp:ssl-allow off;"
          fi
          test -f /tmp/work/.env || { echo "✗ دانلود .env ناموفق"; exit 1; }

          # فقط دو خط مالک — بقیهٔ فایل هرگز خارج از هاست نمی‌رود
          grep -E '^ADMIN_(EMAIL|PASSWORD)=' /tmp/work/.env > /tmp/out/admin-recover.txt || true
          printf 'login: https://dadvarzan.com/admin/login\n' >> /tmp/out/admin-recover.txt
          # پاک‌سازی فوری — کل .env فقط در همین استپ زندگی می‌کند
          rm -f /tmp/work/.env /tmp/work/ftps.err

          # لاگ: فقط ایمیل (نه رمز) برای تأیید اینکه خط پیدا شد
          if grep -q '^ADMIN_PASSWORD=' /tmp/out/admin-recover.txt; then
            echo "✓ خطوط ADMIN پیدا شد — ایمیل: $(grep '^ADMIN_EMAIL=' /tmp/out/admin-recover.txt | cut -d= -f2)"
          else
            echo "✗ ADMIN_PASSWORD در .env هاست پیدا نشد!"
            exit 1
          fi

      - name: Upload artifact (1 day)
        uses: actions/upload-artifact@v4
        with:
          name: admin-recover
          path: /tmp/out/admin-recover.txt
          retention-days: 1
          if-no-files-found: error
