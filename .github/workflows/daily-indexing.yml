name: Daily Indexing Agent

# ─────────────────────────────────────────────────────────────────────────────
# ایجنت روزانهٔ نمایه‌سازی گوگل — هر روز ۰۶:۰۰ به وقت تهران (02:30 UTC)
#
# Job A (همیشه اجرا می‌شود): بازارسال sitemap با سرویس‌اکانت — سیگنال تازگی برای گوگل
# Job B (اگر کوکی تنظیم باشد): ربات مرورگر Playwright وارد UI سرچ‌کنسول می‌شود و
#   برای حداکثر ~۱۰ صفحهٔ مهم صف (seo/indexing-queue.txt) دکمهٔ «Request Indexing» را می‌زند.
#
# کوکی‌ها در Secret با نام GOOGLE_COOKIES_JSON (آرایهٔ JSON یا رشتهٔ هدر Cookie).
# گوگل برای Request Indexing هیچ API رسمی ندارد — فقط مسیر UI همین است.
# وضعیت: seo/indexing-done.txt + seo/indexing-log.jsonl — صف مصرف‌شده به ریپو کامیت می‌شود.
#
# Job C (Bing): پروب روزانهٔ sitemap از خود شبکهٔ مایکروسافت (رانر GitHub روی Azure)
#   + ری‌سابمیت sitemap به Bing Webmaster API. سابقه: UI بینگ خطای
#   «The request has timed out» می‌دهد و CrawlStats خالی است — این پروب مرز مشکل
#   (شبکهٔ مایکروسافت ↔ هاست ایران) را هر روز اندازه‌گیری و ثبت می‌کند.
# ─────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    - cron: '30 2 * * *'   # 06:00 Asia/Tehran (UTC+3:30)
  workflow_dispatch:
    inputs:
      count:
        description: 'حداکثر تعداد URL امروز'
        required: false
        default: '10'
      dry_run:
        description: 'فقط تشخیص، بدون کلیک'
        type: boolean
        required: false
        default: false

concurrency:
  group: daily-indexing
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  resubmit-sitemap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Resubmit sitemap via Search Console API
        env:
          GSC_KEY_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
        run: node scripts/gsc-sitemap-resubmit.mjs

  # ── Job C: بینگ ─────────────────────────────────────────────────────────
  # رانر GitHub روی Azure (IP مایکروسافت) اجرا می‌شود؛ اگر از آنجا sitemap 200 و
  # سریع برگردد، مسیر عمومی مایکروسافت→هاست باز است و تایم‌اوت بینگ باید از
  # فایروال هاست روی رنج IP خودِ Bingbot باشد. بعد از پروب، sitemap به بینگ
  # ری‌سابمیت می‌شود تا هر روز سیگنال خزش تازه بدهد.
  bing-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Probe sitemap.xml از شبکهٔ مایکروسافت (Azure)
        run: |
          CODE=$(curl -sS -o /tmp/sitemap.xml -w "%{http_code}" --max-time 45 https://dadvarzan.com/sitemap.xml || echo curl-failed)
          METRICS=$(curl -sS -o /dev/null -w "ttfb=%{time_starttransfer}s total=%{time_total}s size=%{size_download}B" --max-time 45 https://dadvarzan.com/sitemap.xml || echo curl-failed)
          URLS=$(grep -c "<loc>" /tmp/sitemap.xml || true); [ -n "$URLS" ] || URLS=0
          echo "probe: HTTP=$CODE $METRICS urls=$URLS"
          {
            echo "## Bing probe — $(date -u '+%F %T') UTC"
            echo "- HTTP: \`$CODE\` — $METRICS — URLs: $URLS"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$CODE" != "200" ]; then
            echo "❌ dadvarzan.com از شبکهٔ مایکروسافت در دسترس نیست → عامل تایم‌اوت بینگ"
            exit 1
          fi

      - name: SubmitSitemap (هر دو واریانت) + snapshot روند InIndex
        env:
          BING_API_KEY: ${{ secrets.BING_API_KEY }}
        run: |
          # SubmitSitemap روی هر دو واریانت + snapshot CrawlStats
          # تا وریفیکیشن BWT کامل نشده، خطا به‌صورت شفاف در سامری ثبت می‌شود.
          OUTPUT=$(node scripts/bing-daily.mjs || echo "bing-daily failed")
          {
            echo "$OUTPUT"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: IndexNow — سابمیت کل sitemap به Bing/Yandex/Seznam
        run: |
          OUT=$(node scripts/indexnow-daily.mjs || echo "indexnow failed")
          echo "$OUT"
          echo "$OUT" >> "$GITHUB_STEP_SUMMARY"

  request-indexing:
    runs-on: ubuntu-latest
    needs: resubmit-sitemap
    timeout-minutes: 45
    env:
      RI_COUNT: ${{ inputs.count || '10' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Guard — کوکی تنظیم شده؟
        id: guard
        env:
          C: ${{ secrets.GOOGLE_COOKIES_JSON }}
        run: |
          if [ -z "$C" ]; then
            echo "NO_COOKIES: ربات UI امروز رد شد — کوکی گوگل تنظیم نشده."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Playwright + Chromium (ایزوله از درخت وابستگی پروژه)
        run: |
          mkdir -p /tmp/pw
          cd /tmp/pw
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.49.1
          npx playwright install chromium
          npx playwright install-deps chromium || echo "install-deps skipped (libs usually preinstalled on ubuntu-latest)"
          echo "✓ playwright ready"

      - name: Run request-indexing bot
        if: steps.guard.outputs.skip != 'true'
        env:
          GOOGLE_COOKIES_JSON: ${{ secrets.GOOGLE_COOKIES_JSON }}
          GSC_PROPERTY: sc-domain:dadvarzan.com
        run: |
          FLAGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then FLAGS="--dry-run"; fi
          cp scripts/request-indexing.mjs /tmp/pw/bot.mjs
          node /tmp/pw/bot.mjs --count "$RI_COUNT" $FLAGS

      - name: Commit updated queue/state
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "dadvarzan-bot"
          git config user.email "vahid.askari1986@gmail.com"
          git add seo/indexing-queue.txt seo/indexing-done.txt seo/indexing-log.jsonl 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "چیزی برای کامیت نبود"
          else
            git commit -m "indexing-bot: daily request-indexing run $(date -u +%F) [skip deploy]"
            git push
          fi

      - name: Upload screenshots (diagnostics)
        if: steps.guard.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: indexing-bot-shots
          path: seo/shots/
          retention-days: 7
          if-no-files-found: ignore
