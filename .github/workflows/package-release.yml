name: Package release (cPanel)

# ─────────────────────────────────────────────────────────────────────────────
# بیلد standalone + انتشار به GitHub Releases با تگ ثابت latest-cpanel
# + آپلود مستقیم tarball به اینباکس هاست (FTP) — چون دانلود github از ایران
#   بسیار کند است، deploy-agent تاربال محلی را ترجیح می‌دهد (مسیر ۱) و
#   دانلود github فقط fallback است.
# deploy-agent روی هاست هر ۵ دقیقه چک می‌کند: اینباکس جدید → extract + restart.
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
    # تغییرات غیراپ دیپلوی بی‌مورد نساز (کامیت‌های ربات نمایه‌سازی، ورک‌فلوها، اسکریپت‌های ابزار)
    paths-ignore:
      - 'seo/**'
      - 'scripts/**'
      - '.github/**'
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

concurrency:
  group: package-release
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.BUILD_DATABASE_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_GA_ID: ${{ vars.NEXT_PUBLIC_GA_ID }}
          NEXT_PUBLIC_GSC_VERIFICATION: ${{ vars.NEXT_PUBLIC_GSC_VERIFICATION }}
          NEXT_PUBLIC_BING_VERIFICATION: ${{ vars.NEXT_PUBLIC_BING_VERIFICATION }}
          NEXT_PUBLIC_TELEGRAM_BOT: ${{ vars.NEXT_PUBLIC_TELEGRAM_BOT }}
        run: bun run build

      - name: Package
        env:
          SMS_FARAZ_API_KEY: ${{ secrets.SMS_FARAZ_API_KEY }}
          SMS_FARAZ_SENDER: ${{ secrets.SMS_FARAZ_SENDER }}
          SMS_FARAZ_PATTERN_CODE: ${{ secrets.SMS_FARAZ_PATTERN_CODE }}
          SMS_FARAZ_PATTERN_VAR: ${{ secrets.SMS_FARAZ_PATTERN_VAR }}
        run: |
          set -e
          mkdir -p pkg/.next
          cp -a .next/standalone/. pkg/
          cp -a .next/static pkg/.next/static
          cp -a public pkg/public
          cp deploy/cpanel/app.js pkg/app.js
          # لایهٔ env مکمل (app.js آن را بعد از .env اصلی می‌خواند) — کلید فراز از Secret می‌آید، در کد/ریپو نیست
          {
            [ -n "$SMS_FARAZ_API_KEY" ] && echo "SMS_FARAZ_API_KEY=$SMS_FARAZ_API_KEY" || true
            [ -n "$SMS_FARAZ_SENDER" ] && echo "SMS_FARAZ_SENDER=$SMS_FARAZ_SENDER" || true
            [ -n "$SMS_FARAZ_PATTERN_CODE" ] && echo "SMS_FARAZ_PATTERN_CODE=$SMS_FARAZ_PATTERN_CODE" || true
            [ -n "$SMS_FARAZ_PATTERN_VAR" ] && echo "SMS_FARAZ_PATTERN_VAR=$SMS_FARAZ_PATTERN_VAR" || true
          } > pkg/.env.local
          tar -czf release.tar.gz -C pkg .

      - name: Publish to GitHub Release (latest-cpanel)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest-cpanel --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          sleep 3
          gh release create latest-cpanel release.tar.gz \
            --repo "$GITHUB_REPOSITORY" \
            --title "cPanel deploy" \
            --notes "باندل standalone برای deploy-agent — $GITHUB_SHA" \
            --latest

      - name: Upload tarball to host inbox (FTP)
        env:
          FTP_HOST: ${{ secrets.CPANEL_FTP_HOST }}
          FTP_PORT: ${{ secrets.CPANEL_FTP_PORT || 21 }}
          FTP_USER: ${{ secrets.CPANEL_FTP_USER }}
          FTP_PASS: ${{ secrets.CPANEL_FTP_PASS }}
          APP_DIR: ${{ secrets.CPANEL_APP_DIR }}
        run: |
          set -e
          sudo apt-get update -y -qq >/dev/null 2>&1 || true
          sudo apt-get install -y -qq lftp >/dev/null 2>&1 || sudo apt-get install -y lftp
          lftp --version | head -1
          curl -sL --retry 3 -o release.tar.gz \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/latest-cpanel/release.tar.gz"
          ls -la release.tar.gz
          lftp -u "$FTP_USER","$FTP_PASS" -p "$FTP_PORT" "ftp://$FTP_HOST" <<EOF
            set net:max-retries 5
            set net:timeout 40
            set ftp:ssl-allow off
            set ftp:passive-mode on
            mkdir -p "$APP_DIR/.release-inbox"
            put -O "$APP_DIR/.release-inbox" release.tar.gz
            bye
          EOF
          echo "✓ tarball به اینباکس هاست آپلود شد — deploy-agent در tick بعدی کرون نصب می‌کند"
